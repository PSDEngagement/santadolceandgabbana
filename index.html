// Expand by adding variations (short, medium, long) and modifiers for more unique comments
const modifiers = [
  "",
  " Truly inspiring.",
  " Cannot wait for more.",
  " Absolute favorite.",
  " So elegant.",
  " Beyond perfect.",
  " Iconic.",
  " Timeless beauty.",
  " Fashion excellence.",
  " Simply the best."
];

function generateComment() {
  const lang = languages[Math.floor(Math.random() * languages.length)];
  const baseList = templates[lang];
  if (!baseList || baseList.length === 0) return null;

  let attempts = 0;
  const maxAttempts = 50;
  while (attempts < maxAttempts) {
    const base = baseList[Math.floor(Math.random() * baseList.length)];
    const mod = modifiers[Math.floor(Math.random() * modifiers.length)];
    let comment = base;
    if (mod && Math.random() > 0.4) {
      comment += mod;
    }
    // Occasionally make shorter or add slight variation
    if (Math.random() < 0.3) {
      comment = base.split('.')[0] + '.';
    }
    if (!usedComments.has(comment)) {
      return comment;
    }
    attempts++;
  }
  // Fallback: append a unique number if somehow exhausted (unlikely)
  const fallback = baseList[0] + " " + Date.now();
  if (!usedComments.has(fallback)) return fallback;
  return null;
}

async function generateAndCopy() {
  const comment = generateComment();
  if (!comment) {
    previewEl.textContent = "No more unique comments available at this time.";
    return;
  }
  usedComments.add(comment);
  count++;
  safeSetItem(STORAGE_KEY, JSON.stringify([...usedComments]));
  safeSetItem(COUNT_KEY, count.toString());
  updateCounter();
  previewEl.textContent = comment;

  try {
    await navigator.clipboard.writeText(comment);
  } catch (err) {
    // Fallback for older browsers
    const textArea = document.createElement('textarea');
    textArea.value = comment;
    document.body.appendChild(textArea);
    textArea.select();
    document.execCommand('copy');
    document.body.removeChild(textArea);
  }
}

btn.addEventListener('click', generateAndCopy);

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !e.repeat) {
    e.preventDefault();
    generateAndCopy();
  }
});
